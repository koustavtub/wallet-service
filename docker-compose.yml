services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: keychain-postgres
    environment:
      POSTGRES_DB:       keychain
      POSTGRES_USER:     keychain
      POSTGRES_PASSWORD: keychain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keychain -d keychain"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Wallet Service ──────────────────────────────────────────────────────────
  wallet-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keychain-wallet
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL:  jdbc:postgresql://postgres:5432/keychain
      DB_USER: keychain
      DB_PASS: keychain
      PORT:    8080
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  postgres_data:

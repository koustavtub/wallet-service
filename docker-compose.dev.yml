# Lightweight compose for local development.
# Runs only Postgres so you can run the app directly with `make run` or your IDE.
# Usage: make db-up

services:
  postgres:
    image: postgres:18-alpine
    container_name: keychain-postgres-dev
    environment:
      POSTGRES_DB:       keychain
      POSTGRES_USER:     keychain
      POSTGRES_PASSWORD: keychain
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keychain -d keychain"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
